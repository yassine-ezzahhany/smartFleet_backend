<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartFleet WebSocket Test Client</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <!-- SockJS and STOMP libraries from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    
    <style>
        :root {
            --bg-color: #0d0f14;
            --card-bg: rgba(22, 28, 41, 0.7);
            --border-color: rgba(255, 255, 255, 0.08);
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --accent: #10b981;
            --accent-hover: #059669;
            --text-color: #f3f4f6;
            --text-muted: #9ca3af;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 2rem;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.08) 0%, transparent 40%),
                              radial-gradient(circle at 90% 80%, rgba(16, 185, 129, 0.05) 0%, transparent 40%);
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
            body {
                padding: 1rem;
            }
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .header {
            grid-column: span 2;
            text-align: center;
        }

        @media (max-width: 768px) {
            .header {
                grid-column: span 1;
            }
        }

        .header h1 {
            margin: 0;
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #60a5fa 0%, #10b981 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            margin: 0.5rem 0 0;
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .section-title {
            margin: 0 0 0.5rem;
            font-size: 1.25rem;
            font-weight: 600;
            color: #fff;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 0.5rem;
            display: inline-block;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 0.35rem 0.75rem;
            border-radius: 9999px;
            align-self: flex-start;
        }

        .status-disconnected {
            background-color: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .status-connected {
            background-color: rgba(16, 185, 129, 0.15);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .input-group label {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        input {
            background-color: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.75rem;
            color: #fff;
            font-family: inherit;
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.3);
        }

        button {
            font-family: inherit;
            font-weight: 600;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1rem;
        }

        .btn-primary {
            background-color: var(--primary);
            color: #fff;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-accent {
            background-color: var(--accent);
            color: #fff;
        }

        .btn-accent:hover {
            background-color: var(--accent-hover);
        }

        .logs-container {
            background-color: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1rem;
            height: 250px;
            overflow-y: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .log-entry {
            border-left: 2px solid var(--primary);
            padding-left: 0.5rem;
        }

        .log-websocket {
            border-color: var(--accent);
            color: #a7f3d0;
        }

        .log-rest {
            border-color: #f59e0b;
            color: #fef3c7;
        }

        .log-error {
            border-color: #ef4444;
            color: #fee2e2;
        }

        .timestamp {
            color: var(--text-muted);
            font-size: 0.75rem;
            margin-right: 0.5rem;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="header">
            <h1>🚚 SmartFleet Test Center</h1>
            <p>Connectez-vous au WebSocket et déclenchez des événements via l'API REST</p>
        </div>

        <!-- Connection and Subscription Card -->
        <div class="card">
            <div>
                <span class="section-title">Connexion WebSocket</span>
            </div>
            
            <div id="ws-status" class="status-badge status-disconnected">
                🔴 Déconnecté
            </div>

            <div class="input-group">
                <label for="ws-url">WebSocket Handshake URL</label>
                <input type="text" id="ws-url" value="http://localhost:8080/api/ws">
            </div>

            <div class="input-group">
                <label for="driver-id">Driver ID à suivre</label>
                <input type="number" id="driver-id" value="1">
            </div>

            <div style="display: flex; gap: 1rem; margin-top: 0.5rem;">
                <button id="connect-btn" class="btn-primary" onclick="connect()">Se connecter</button>
                <button id="disconnect-btn" class="btn-primary" onclick="disconnect()" style="background-color: #374151; display: none;">Se déconnecter</button>
            </div>
        </div>

        <!-- REST Location Trigger Card -->
        <div class="card">
            <div>
                <span class="section-title">Simulateur Chauffeur (REST API)</span>
            </div>
            
            <div class="input-group">
                <label for="rest-driver-id">Driver ID</label>
                <input type="number" id="rest-driver-id" value="1">
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="input-group">
                    <label for="lat">Latitude (ex: Rabat)</label>
                    <input type="number" id="lat" value="33.9716" step="0.0001">
                </div>
                <div class="input-group">
                    <label for="lon">Longitude (ex: Rabat)</label>
                    <input type="number" id="lon" value="-6.8498" step="0.0001">
                </div>
            </div>

            <button class="btn-accent" onclick="sendRestUpdate()" style="margin-top: 0.5rem;">
                Envoyer la position via API REST
            </button>
        </div>

        <!-- Real-time Event Feed -->
        <div class="card" style="grid-column: span 2;">
            <div>
                <span class="section-title">Flux d'Événements en Temps Réel</span>
            </div>
            <div id="logs" class="logs-container">
                <div class="log-entry" style="border-left-color: var(--text-muted);">En attente de connexion...</div>
            </div>
        </div>

    </div>

    <script>
        let stompClient = null;
        let subscription = null;

        function log(message, type = '') {
            const logsContainer = document.getElementById('logs');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            
            const time = new Date().toLocaleTimeString();
            entry.innerHTML = `<span class="timestamp">[${time}]</span> ${message}`;
            
            logsContainer.appendChild(entry);
            logsContainer.scrollTop = logsContainer.scrollHeight;
        }

        function connect() {
            const url = document.getElementById('ws-url').value;
            const driverId = document.getElementById('driver-id').value;
            
            log(`Connexion à ${url}...`);
            
            const socket = new SockJS(url);
            stompClient = Stomp.over(socket);
            
            // Masquer les logs de debug dans la console navigateur pour la lisibilité
            stompClient.debug = null; 

            stompClient.connect({}, function (frame) {
                document.getElementById('ws-status').innerHTML = '🟢 Connecté et abonné';
                document.getElementById('ws-status').className = 'status-badge status-connected';
                document.getElementById('connect-btn').style.display = 'none';
                document.getElementById('disconnect-btn').style.display = 'inline-block';
                
                log('Handshake WebSocket réussi ! Connecté au serveur STOMP.', 'log-websocket');
                
                // S'abonner aux mises à jour du chauffeur
                const topic = `/topic/drivers/${driverId}/location`;
                log(`Abonnement au topic : ${topic}`, 'log-websocket');
                
                subscription = stompClient.subscribe(topic, function (response) {
                    const data = JSON.parse(response.body);
                    log(`➡ MESSAGE REÇU DU WEBSOCKET (Topic: ${topic}) :<br><pre style="margin: 0.5rem 0 0 0; background: rgba(0,0,0,0.5); padding: 0.5rem; border-radius: 4px;">${JSON.stringify(data, null, 2)}</pre>`, 'log-websocket');
                });
            }, function (error) {
                log(`Erreur de connexion : ${error}`, 'log-error');
                disconnect();
            });
        }

        function disconnect() {
            if (subscription) {
                subscription.unsubscribe();
                subscription = null;
            }
            if (stompClient !== null) {
                stompClient.disconnect();
                stompClient = null;
            }
            document.getElementById('ws-status').innerHTML = '🔴 Déconnecté';
            document.getElementById('ws-status').className = 'status-badge status-disconnected';
            document.getElementById('connect-btn').style.display = 'inline-block';
            document.getElementById('disconnect-btn').style.display = 'none';
            log('Déconnecté du WebSocket.');
        }

        async function sendRestUpdate() {
            const driverId = document.getElementById('rest-driver-id').value;
            const lat = parseFloat(document.getElementById('lat').value);
            const lon = parseFloat(document.getElementById('lon').value);
            const timestamp = Date.now();

            const url = `http://localhost:8080/api/drivers/${driverId}/location`;
            log(`Envoi de la requête REST PUT à : ${url}...`, 'log-rest');

            try {
                const response = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        latitude: lat,
                        longitude: lon,
                        timestamp: timestamp
                    })
                });

                if (response.ok) {
                    log(`API REST : Position mise à jour pour le chauffeur ${driverId} ! (HTTP 200 OK)`, 'log-rest');
                } else {
                    log(`API REST : Échec de la mise à jour (Code HTTP: ${response.status})`, 'log-error');
                }
            } catch (err) {
                log(`API REST : Erreur réseau lors de la mise à jour : ${err}`, 'log-error');
            }
        }
    </script>
</body>
</html>
