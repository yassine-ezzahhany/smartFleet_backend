# ===== Spring Boot Application =====
spring.application.name=smartfleet-backend
server.port=8080
server.servlet.context-path=/api

# ===== Swagger / OpenAPI =====
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.display-request-duration=true
spring.config.import=optional:file:.env[.properties]

# ===== Supabase / PostgreSQL + PostGIS =====
# Reads from .env — fallback values are placeholders only
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Supabase Transaction Pooler (PgBouncer) — required settings
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
# Needed for PgBouncer in transaction mode (no prepared statements)
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# SSL required by Supabase
spring.datasource.hikari.data-source-properties.sslmode=require

# ===== JPA & Hibernate =====
# Use 'create' on first run to create tables, then switch to 'validate'
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
# Disable prepared statement caching (PgBouncer transaction mode requirement)
spring.jpa.properties.hibernate.jdbc.use_get_generated_keys=true

# ===== Logging =====
logging.level.root=INFO
logging.level.ma.smartfleet.backend=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG

# ===== Security & Clerk JWT =====
app.security.clerk.issuer=${CLERK_ISSUER}
app.security.clerk.audience=${CLERK_AUDIENCE}

# ===== Valhalla =====
valhalla.service.url=${VALHALLA_URL:http://localhost:8002}
valhalla.service.timeout-seconds=30
valhalla.costing=auto

# ===== Firebase =====
firebase.config.path=src/main/resources/firebase-config.json
firebase.notification.enabled=true

# ===== Application =====
app.depot.latitude=33.9716
app.depot.longitude=-6.8498
app.max-orders-per-route=50

# ===== CORS =====
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
spring.web.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true
spring.web.cors.max-age=3600

# ===== Jackson =====
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.indent-output=true
spring.jackson.deserialization.adjust-dates-to-context-timezone=false
