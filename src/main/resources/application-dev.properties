# ===== Development Profile Configuration =====
spring.application.name=smartfleet-backend
server.port=8080

# ===== PostgreSQL & PostGIS Configuration (Development) =====
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA & Hibernate Configuration (Development) =====
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== Logging (Development - Debug) =====
logging.level.root=INFO
logging.level.ma.smartfleet.backend=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# ===== Valhalla (Local Development) =====
valhalla.service.url=http://localhost:8002
valhalla.service.timeout-seconds=30

# ===== Firebase (Development) =====
firebase.notification.enabled=false

# ===== CORS (Development - All Origins) =====
spring.web.cors.allowed-origins=http://localhost:3000,http://localhost:3001,http://localhost:4200
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true
