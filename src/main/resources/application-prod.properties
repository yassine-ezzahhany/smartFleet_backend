# ===== Production Profile Configuration =====
spring.application.name=smartfleet-backend
server.port=8080

# ===== PostgreSQL & PostGIS Configuration (Production) =====
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5

# ===== JPA & Hibernate Configuration (Production) =====
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ===== Logging (Production - Minimal) =====
logging.level.root=WARN
logging.level.ma.smartfleet.backend=INFO
logging.level.org.springframework.security=WARN

# ===== Security Configuration (Production) =====
app.security.clerk.issuer=${CLERK_ISSUER}
app.security.clerk.audience=${CLERK_AUDIENCE}
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION}

# ===== Valhalla (Production) =====
valhalla.service.url=${VALHALLA_SERVICE_URL}
valhalla.service.timeout-seconds=30

# ===== Firebase (Production) =====
firebase.config.path=${FIREBASE_CONFIG_PATH}
firebase.notification.enabled=true

# ===== CORS (Production - Restricted) =====
spring.web.cors.allowed-origins=${ALLOWED_ORIGINS}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true
spring.web.cors.max-age=3600

# ===== SSL Configuration (Production) =====
server.ssl.enabled=${SSL_ENABLED:false}
server.ssl.key-store=${SSL_KEYSTORE_PATH}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
server.ssl.key-store-type=PKCS12
